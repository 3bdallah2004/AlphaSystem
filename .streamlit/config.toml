[theme]
base = "dark"
primaryColor = "#0A6CFF"
backgroundColor = "#040B1C"
secondaryBackgroundColor = "#091428"
textColor = "#EEF3FF"
linkColor = "#5AA8FF"
borderColor = "#1F2D4B"
showWidgetBorder = true
redColor = "#FF6B4A"
baseRadius = "12px"
buttonRadius = "999px"
baseFontSize = 15
font = "Tajawal:https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap, sans-serif"
headingFont = "Tajawal:https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap, sans-serif"

[server]
# Case attachments can include video, so allow uploads up to this size (mirrors ALPHA_MAX_ATTACHMENT_MB).
maxUploadSize = 200

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
